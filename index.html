/* =====================================================================
 * 10/e. MODUL: FELADATOK – logika (tiszta függvények)
 *   Tárolás: 'tasks' kulcs  →  { schema, tasks: [...], log: { 'ÉÉÉÉ-HH-NN': { taskId: { s: 'done'|'skipped', at, demo? } } } }
 *   Gyakoriság (freq.type): daily | weekdays | weekends | days (days: [0..6], 0 = vasárnap)
 *                            | everyNWeeks (n, start) | monthDay (day: 1..31; rövid hónapban az utolsó nap)
 * ===================================================================== */
const Tasks = (function () {
  const KEY = 'tasks', SCHEMA = 1;
  const FREQS = ['daily', 'weekdays', 'weekends', 'days', 'everyNWeeks', 'monthDay'];
  const LINKS = ['empty-space', 'export-pallets', 'machine-log'];

  function defaults(today) {
    return { schema: SCHEMA, log: {}, tasks: [
      { id: 't1', name: 'Üres hely számolás', freq: { type: 'weekdays' }, from: '07:00', to: '08:00', link: 'empty-space', createdAt: today },
      { id: 't2', name: 'Export raklap számolás', freq: { type: 'weekdays' }, from: '07:00', to: '08:00', link: 'export-pallets', createdAt: today },
      { id: 't3', name: 'Gépnapló ellenőrzés', freq: { type: 'days', days: [0] }, from: null, to: null, link: 'machine-log', createdAt: today }
    ] };
  }
  function validateTask(t) {
    if (!t || typeof t !== 'object' || typeof t.name !== 'string' || !t.name.trim()) return 'name';
    const f = t.freq;
    if (!f || !FREQS.includes(f.type)) return 'freq';
    if (f.type === 'days' && (!Array.isArray(f.days) || !f.days.length || f.days.some(d => !Number.isInteger(d) || d < 0 || d > 6))) return 'days';
    if (f.type === 'everyNWeeks') {
      if (!Number.isInteger(f.n) || f.n < 1 || f.n > 52) return 'n';
      if (!isValidIsoDate(f.start)) return 'start';
    }
    if (f.type === 'monthDay' && (!Number.isInteger(f.day) || f.day < 1 || f.day > 31)) return 'monthDay';
    const hasFrom = t.from != null && t.from !== '', hasTo = t.to != null && t.to !== '';
    if (hasFrom !== hasTo) return 'time';
    if (hasFrom && (!isValidTime(t.from) || !isValidTime(t.to) || t.from >= t.to)) return 'time';
    if (t.link != null && t.link !== '' && !LINKS.includes(t.link)) return 'link';
    return null;
  }
  function normalizeTask(t) {
    const f = { type: t.freq.type };
    if (f.type === 'days') f.days = Array.from(new Set(t.freq.days)).sort();
    if (f.type === 'everyNWeeks') { f.n = t.freq.n; f.start = t.freq.start; }
    if (f.type === 'monthDay') f.day = t.freq.day;
    return { id: String(t.id), name: t.name.trim(), freq: f, from: t.from || null, to: t.to || null, link: t.link || null,
      createdAt: isValidIsoDate(t.createdAt) ? t.createdAt : null };
  }
  function load(store, today) {
    const s = store.read(KEY, null);
    if (!s || typeof s !== 'object' || !Array.isArray(s.tasks)) return defaults(today);
    const out = { schema: SCHEMA, tasks: s.tasks.filter(t => t && t.id != null && !validateTask(t)).map(normalizeTask),
      log: (s.log && typeof s.log === 'object') ? s.log : {} };
    if (isValidIsoDate(s.demoFrom)) out.demoFrom = s.demoFrom;
    return out;
  }
  function save(store, state) { return store.write(KEY, state); }
  function ensureSaved(store, today) {
    if (store.read(KEY, null) == null) save(store, defaults(today));
    return load(store, today);
  }
  function isDue(task, iso) {
    const f = task.freq, wd = weekdayOf(iso);
    switch (f.type) {
      case 'daily': return true;
      case 'weekdays': return wd >= 1 && wd <= 5;
      case 'weekends': return wd === 0 || wd === 6;
      case 'days': return f.days.includes(wd);
      case 'everyNWeeks': {
        const diff = daysBetween(f.start, iso);
        return diff >= 0 && diff % 7 === 0 && (diff / 7) % f.n === 0;
      }
      case 'monthDay': {
        const [y, m, d] = iso.split('-').map(Number);
        const last = new Date(y, m, 0).getDate();
        return d === Math.min(f.day, last);
      }
      default: return false;
    }
  }
  // A feladat ezen a napon már létezett-e (a demó időszak is ide számít).
  function existsOn(state, task, iso) {
    const from = [task.createdAt, state.demoFrom].filter(Boolean).sort()[0];
    return !from || iso >= from;
  }
  function dueTasks(state, iso) { return state.tasks.filter(t => existsOn(state, t, iso) && isDue(t, iso)); }
  function entry(state, iso, id) { return (state.log[iso] && state.log[iso][id]) || null; }
  // Állapot: done | skipped | late | due   (a "Késik": az időszak vége elmúlt és nincs pipa)
  function statusOf(state, task, iso, now) {
    const e = entry(state, iso, task.id);
    if (e && e.s === 'done') return 'done';
    if (e && e.s === 'skipped') return 'skipped';
    const today = isoDate(now);
    if (iso < today) return 'late';
    if (iso > today) return 'due';
    if (task.to) {
      const [hh, mm] = task.to.split(':').map(Number);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
      if (now > end) return 'late';
    }
    return 'due';
  }
  function setMark(state, iso, id, s, at, demo) {
    const log = Object.assign({}, state.log);
    const day = Object.assign({}, log[iso] || {});
    if (s) { day[id] = { s, at: at || new Date().toISOString() }; if (demo) day[id].demo = true; }
    else delete day[id];
    if (Object.keys(day).length) log[iso] = day; else delete log[iso];
    return Object.assign({}, state, { log });
  }
  function saveTask(state, task, today) {
    const exists = task.id && state.tasks.some(x => x.id === task.id);
    let id = task.id;
    if (!exists) { let k = state.tasks.length + 1; while (state.tasks.some(x => x.id === 't' + k)) k++; id = 't' + k; }
    const t = normalizeTask(Object.assign({}, task, { id, createdAt: exists ? state.tasks.find(x => x.id === id).createdAt : today }));
    return Object.assign({}, state, { tasks: exists ? state.tasks.map(x => (x.id === id ? t : x)) : state.tasks.concat([t]) });
  }
  function deleteTask(state, id) {
    const log = {};
    Object.entries(state.log).forEach(([d, v]) => { const c = Object.assign({}, v); delete c[id]; if (Object.keys(c).length) log[d] = c; });
    return Object.assign({}, state, { tasks: state.tasks.filter(t => t.id !== id), log });
  }
  // Előzmények: a mai naptól visszafelé (legfeljebb maxDays nap), csak ahol volt esedékes feladat.
  function history(state, now, maxDays) {
    maxDays = maxDays || 60;
    const today = isoDate(now);
    const starts = state.tasks.map(t => t.createdAt).concat(Object.keys(state.log), state.demoFrom ? [state.demoFrom] : []).filter(Boolean).sort();
    const start = starts[0] || today;
    const out = [];
    for (let i = 1; i <= maxDays; i++) {
      const iso = addDays(today, -i);
      if (iso < start) break;
      const items = dueTasks(state, iso).map(task => {
        const st = statusOf(state, task, iso, now);
        return { task, status: st === 'late' ? 'missed' : st, demo: !!(entry(state, iso, task.id) || {}).demo };
      });
      if (!items.length) continue;
      const count = s => items.filter(x => x.status === s).length;
      out.push({ date: iso, items, done: count('done'), missed: count('missed'), skipped: count('skipped') });
    }
    return out;
  }
  function buildExport(state, now) {
    return JSON.parse(JSON.stringify({ app: APP_ID, module: 'tasks', schema: SCHEMA, exportedAt: (now || new Date()).toISOString(), tasks: state.tasks, log: state.log }));
  }
  function validateImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'json' }; }
    if (!obj || typeof obj !== 'object' || obj.app !== APP_ID || obj.module !== 'tasks' || typeof obj.schema !== 'number' ||
        obj.schema > SCHEMA || !Array.isArray(obj.tasks) || !obj.log || typeof obj.log !== 'object' || Array.isArray(obj.log)) return { ok: false, error: 'format' };
    const ids = new Set();
    for (let i = 0; i < obj.tasks.length; i++) {
      const t = obj.tasks[i];
      const r = (!t || t.id == null || ids.has(String(t.id))) ? 'name' : validateTask(t);
      if (r) return { ok: false, error: 'task', index: i + 1, reason: r };
      ids.add(String(t.id));
    }
    for (const [d, v] of Object.entries(obj.log)) {
      if (!isValidIsoDate(d) || !v || typeof v !== 'object') return { ok: false, error: 'log' };
      for (const e of Object.values(v)) if (!e || (e.s !== 'done' && e.s !== 'skipped')) return { ok: false, error: 'log' };
    }
    return { ok: true, tasks: obj.tasks.map(normalizeTask), log: obj.log };
  }
  function mergeImport(state, data) {
    const incoming = new Set(data.tasks.map(t => t.id));
    const overwrite = state.tasks.filter(t => incoming.has(t.id)).length;
    const tasks = state.tasks.filter(t => !incoming.has(t.id)).concat(data.tasks);
    const log = Object.assign({}, state.log);
    Object.entries(data.log).forEach(([d, v]) => { log[d] = Object.assign({}, log[d] || {}, v); });
    return { state: Object.assign({}, state, { tasks, log }), overwrite, n: data.tasks.length };
  }
  function generateDemo(state, now, count) {
    count = count || 10;
    const today = isoDate(now);
    let seed = 5, s = state, added = 0;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const from = addDays(today, -count);
    s = Object.assign({}, s, { demoFrom: s.demoFrom && s.demoFrom < from ? s.demoFrom : from });
    for (let i = count; i >= 1; i--) {
      const iso = addDays(today, -i);
      dueTasks(s, iso).forEach(task => {
        if (entry(s, iso, task.id)) return;            // saját pipát nem ír felül
        const r = rnd();
        if (r < 0.15) return;                            // elmaradt
        s = setMark(s, iso, task.id, r < 0.3 ? 'skipped' : 'done', new Date(now.getTime() - i * 86400000).toISOString(), true);
        added++;
      });
    }
    return { state: s, added };
  }
  function clearDemo(state) {
    let removed = 0;
    const log = {};
    Object.entries(state.log).forEach(([d, v]) => {
      const c = {};
      Object.entries(v).forEach(([id, e]) => { if (e.demo) removed++; else c[id] = e; });
      if (Object.keys(c).length) log[d] = c;
    });
    const out = Object.assign({}, state, { log });
    delete out.demoFrom;
    return { state: out, removed };
  }
  function stats(state) {
    const days = Object.keys(state.log);
    const demoDays = days.filter(d => Object.values(state.log[d]).every(e => e.demo)).length;
    const times = [];
    days.forEach(d => Object.values(state.log[d]).forEach(e => { if (e.at) times.push(e.at); }));
    times.sort();
    return { days: days.length, demoDays, last: times.length ? times[times.length - 1] : null };
  }
  return { KEY, FREQS, LINKS, defaults, validateTask, load, save, ensureSaved, isDue, dueTasks, entry, statusOf, setMark,
    saveTask, deleteTask, history, buildExport, validateImport, mergeImport, generateDemo, clearDemo, stats };
})();

/* =====================================================================
 * 10/f. MODUL: FELADATOK – felület (a kezdőoldal "Mai teendők" része is ezt használja)
 * ===================================================================== */
function describeFreq(t, task, lang) {
  const f = task.freq;
  if (f.type === 'days') return t('tk.desc.days', { days: f.days.map(d => t('wd.' + d)).join(', ') });
  if (f.type === 'everyNWeeks') return t('tk.desc.everyNWeeks', { n: f.n, date: fmtDate(f.start, lang) });
  if (f.type === 'monthDay') return t('tk.desc.monthDay', { d: f.day });
  return t('tk.freq.' + f.type);
}
function taskItem(ctx, state, task, iso, onChange) {
  const { t } = ctx;
  const now = ctx.now();
  const status = Tasks.statusOf(state, task, iso, now);
  const isToday = iso === isoDate(now);
  const canCheck = can(ctx.mode, 'tasks.check'), canSkip = can(ctx.mode, 'tasks.skip');
  const cbId = 'tk-cb-' + task.id + '-' + iso;
  const cb = h('input', { type: 'checkbox', id: cbId, 'data-task': task.id, 'data-perm': canCheck ? 'tasks.check' : null,
    checked: status === 'done', disabled: !canCheck || status === 'skipped',
    'aria-label': t('tk.markDone', { name: task.name }),
    onchange: e => onChange(Tasks.setMark(state, iso, task.id, e.target.checked ? 'done' : null, new Date().toISOString())) });
  const meta = [describeFreq(t, task, ctx.lang)];
  if (task.from) meta.unshift(task.from + '–' + task.to);
  return h('div', { class: 'task-item st-' + status, 'data-task-item': task.id, 'data-status': status },
    h('div', { class: 'task-main' },
      cb,
      h('label', { for: cbId, class: 'task-name' }, task.name),
      h('span', { class: 'chip st st-' + status, 'data-status-chip': status }, t('tk.status.' + status))),
    h('div', { class: 'task-meta' }, meta.join(' · ')),
    h('div', { class: 'task-actions' },
      (canSkip && status !== 'done') ? h('button', { class: 'btn small', 'data-perm': 'tasks.skip', 'data-skip': task.id,
        onclick: () => onChange(Tasks.setMark(state, iso, task.id, status === 'skipped' ? null : 'skipped', new Date().toISOString())) },
        status === 'skipped' ? t('tk.unskip') : (isToday ? t('tk.skipToday') : t('tk.skipDay'))) : null,
      task.link && findModule(task.link) ? h('a', { class: 'btn small', href: '#' + task.link, 'data-open': task.link }, t('tk.open')) : null));
}
function renderTaskList(ctx, state, iso, onChange, emptyKey) {
  const due = Tasks.dueTasks(state, iso);
  if (!due.length) return h('p', { class: 'empty', 'data-empty': 'tasks' }, ctx.t(emptyKey));

function renderTodayTasks(root, ctx) {

function openTaskEditor(ctx, state, task, onSaved) {

  const nameIn = h('input', { type: 'text', id: 'tk-f-name', value: task ? task.name : '', autocomplete: 'off' });

  const nIn = h('input', { type: 'number', id: 'tk-f-n', min: '1', step: '1', value: f.type === 'everyNWeeks' ? String(f.n) : '2' });

/* =====================================================================
 * 13. ALKALMAZÁS-HÉJ: fejléc, lábléc, útválasztás, modal, toast
 * ===================================================================== */
const App = {};
(function () {
  const backend = detectLocalStorage();
  const store = createStore(backend || memoryBackend(), !!backend);
  const notifications = createNotificationCenter(store);
  let prefs = loadPrefs(store);
  let t = makeT(prefs.lang);
  let downloads = null;
  let modalResolve = null;
  let lastFocus = null;

  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
    else root.removeAttribute('data-theme');
  }
  function setPref(key, value) {
    prefs = Object.assign({}, prefs, { [key]: value });
    savePrefs(store, prefs);
    if (key === 'lang') t = makeT(prefs.lang);
    if (key === 'theme') applyTheme(prefs.theme);
    render();
  }
  function route() {
    const id = (location.hash || '').replace(/^#/, '');
    if (!id) return { view: 'hub' };
    if (id === 'system') return can(prefs.mode, 'system.view') ? { view: 'system' } : { view: 'hub', denied: true };
    const m = findModule(id);
    if (m && m.status === 'ready') return { view: 'module', module: m };
    return { view: 'hub' };
  }

  function toast(msg, isErr) {
    const zone = document.getElementById('toast-zone');
    const el = h('div', { class: 'toast' + (isErr ? ' err' : ''), role: isErr ? 'alert' : 'status' }, msg);
    zone.appendChild(el);
    setTimeout(() => el.remove(), isErr ? 5000 : 3000);
  }
  function closeModal(value) {
    const root = document.getElementById('modal-root');
    root.textContent = '';
    document.removeEventListener('keydown', onModalKey);
    const r = modalResolve; modalResolve = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    if (r) r(value);
  }
  function onModalKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(false); }
    if (e.key === 'Tab') {
      const box = document.querySelector('#modal-root .modal');
      if (!box) return;
      const f = box.querySelectorAll('button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  function modal(opts) {
    if (modalResolve) closeModal(null);
    lastFocus = document.activeElement;
    return new Promise(resolve => {
      modalResolve = resolve;
      const titleId = 'modal-title';
      const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
        h('h2', { id: titleId }, opts.title),
        h('div', { class: 'm-body' }, opts.body),
        h('div', { class: 'm-actions' }, (opts.actions || []).map(a => h('button', {
          class: 'btn' + (a.kind ? ' ' + a.kind : ''), id: a.id,
          onclick: () => { if (a.onClick) a.onClick(); if (!a.keepOpen) closeModal(a.value); }
        }, a.label))));
      const back = h('div', { class: 'modal-back', onclick: e => { if (e.target === back) closeModal(false); } }, box);
      document.getElementById('modal-root').appendChild(back);
      document.addEventListener('keydown', onModalKey);
      const focusTarget = box.querySelector('input, textarea') || box.querySelector('.m-actions .btn:last-child');
      if (focusTarget) focusTarget.focus();
    });
  }
  function confirmDialog(title, message, okLabel, danger) {
    return modal({ title, body: [h('p', null, message)], actions: [
      { label: t('btn.cancel'), value: false },
      { label: okLabel, value: true, kind: danger ? 'danger solid' : 'primary', id: 'confirm-ok' }
    ] });
  }
  async function saveFile(filename, text) {
    if (downloads) {
      try { await downloads.save({ filename, data: text }); toast(t('es.export.saved')); }
      catch (e) { toast(t('es.export.declined'), true); }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = h('a', { href: url, download: filename, style: 'display:none' });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) { toast(t('es.export.copyFailed'), true); }
  }
  async function copyText(text, ta) {
    try { await navigator.clipboard.writeText(text); toast(t('es.export.copied')); }
    catch (e) { if (ta) { ta.focus(); ta.select(); } toast(t('es.export.copyFailed'), true); }
  }
  function today() { return isoDate(new Date()); }
  function now() { return new Date(); }
  // Másolás üzenetként: vágólap, sikertelen esetben kézi másolás ablak.
  async function copyMessage(text) {
    try { await navigator.clipboard.writeText(text); toast(t('dl.copyMsg.done', { text })); }
    catch (e) {
      const ta = h('textarea', { id: 'copy-msg-text', readonly: true, rows: 3 }, text);
      modal({ title: t('dl.copyMsg'), body: [h('p', null, t('dl.copyMsg.manual')), ta], actions: [{ label: t('btn.close'), value: true, kind: 'primary' }] });
      ta.focus(); ta.select();
    }
  }

  function makeCtx() {
    return { t, lang: prefs.lang, theme: prefs.theme, mode: prefs.mode, store, today, now, toast, modal, closeModal,
      confirm: confirmDialog, saveFile, copyText, copyMessage, notifications, rerender: render };
  }

  function showGuide() {
    const r = route();
    let title = t('guide.title.hub'), text = t('guide.hub');
    if (r.view === 'module' && r.module.guideKey) { title = t('guide.title.module', { name: t(r.module.titleKey) }); text = t(r.module.guideKey); }
    if (r.view === 'system') { title = t('guide.title.module', { name: t('sys.title') }); text = t('guide.system'); }
    modal({ title, body: text.split('\n').map(p => h('p', null, p)), actions: [{ label: t('btn.close'), value: true, kind: 'primary' }] });
  }
  function showNotifications() {
    const list = notifications.list();
    const body = list.length
      ? list.map(n => h('div', { class: 'notif-item' + (n.read ? '' : ' unread') },
          h('strong', null, n.titleKey ? t(n.titleKey) : (n.title || '')),
          (n.bodyKey || n.body) ? h('span', null, n.bodyKey ? t(n.bodyKey) : n.body) : null,
          h('time', { datetime: n.date }, fmtDateTime(n.date, prefs.lang))))
      : [h('p', { class: 'empty', id: 'notif-empty' }, t('notif.empty'))];
    const actions = [{ label: t('btn.close'), value: true, kind: 'primary' }];
    if (notifications.unreadCount() > 0) actions.unshift({ label: t('notif.markRead'), value: true, onClick: () => notifications.markAllRead() });
    modal({ title: t('notif.title'), body, actions });
  }

  function renderHeader(el, ctx) {
    el.textContent = '';
    const unread = notifications.unreadCount();
    el.appendChild(h('div', { class: 'wrap' },

  function renderFooter(el, ctx) {
    el.textContent = '';
    el.appendChild(h('div', { class: 'wrap' },
      h('span', null, ctx.t('app.fictional')),
      h('span', { id: 'app-version' }, ctx.t('footer.version', { v: VERSION }))));
  }
  function renderMain(el, ctx, r) {
    el.textContent = '';
    if (!ctx.store.persistent) el.appendChild(h('div', { class: 'storage-warn', role: 'alert', id: 'storage-warn' }, ctx.t('storage.unavailable')));
    if (r.view === 'module') {
      el.appendChild(h('div', { class: 'view-head' },
        h('a', { class: 'btn', href: '#', id: 'back-home' }, icon('back'), ctx.t('btn.home')),
        h('h1', null, ctx.t(r.module.titleKey))));
      r.module.render(el, ctx);
    } else if (r.view === 'system') {
      renderSystem(el, ctx);
    } else {
      renderHub(el, ctx);
    }
  }
  let lastView = null;
  function render() {
    const r = route();
    if (r.denied) { history.replaceState(null, '', location.pathname + location.search); toast(t('route.denied'), true); }
    const ctx = makeCtx();
    document.documentElement.lang = prefs.lang;
    document.title = t('app.name');
    renderHeader(document.getElementById('app-header'), ctx);
    renderMain(document.getElementById('app-main'), ctx, r);
    renderFooter(document.getElementById('app-footer'), ctx);
    const key = r.view + ':' + (r.module ? r.module.id : '');
    if (lastView !== null && key !== lastView) window.scrollTo(0, 0);
    lastView = key;
  }

  Object.assign(App, { store, notifications, render, get prefs() { return prefs; }, setPref, modal, closeModal, renderHeader, renderMain, makeCtx });

  applyTheme(prefs.theme);
  window.addEventListener('hashchange', () => { if (modalResolve) closeModal(null); render(); });
  notifications.onChange(() => renderHeader(document.getElementById('app-header'), makeCtx()));
  if (window.matchMedia) {
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch (e) { /* régi böngésző */ }
  }
  render();
  // Opcionális: a claude.ai megosztott oldalán a fájlmentést a "downloads" képesség végzi.
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
    }
  } catch (e) { /* nincs ilyen környezet */ }
})();

function parseColor(s) {
  const cs = String(s).match(/color\(srgb\s+([^)]+)\)/);
  if (cs) {
    const p = cs[1].split(/[ /]+/).filter(Boolean).map(Number);
    return [p[0] * 255, p[1] * 255, p[2] * 255, p[3] == null ? 1 : p[3]];
  }
  const m = String(s).match(/rgba?\(([^)]+)\)/);
  if (!m) {
    const c = document.createElement('canvas').getContext('2d');
    c.fillStyle = s; c.fillRect(0, 0, 1, 1);
    const d = c.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2], d[3] / 255];
  }
  const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number);
  return [p[0], p[1], p[2], p[3] == null ? 1 : p[3]];
}
function effectiveBg(el) {
  let layers = [];
  for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
    const c = parseColor(getComputedStyle(n).backgroundColor);
    if (c[3] > 0) { layers.push(c); if (c[3] >= 1) break; }
  }
  if (!layers.length || layers[layers.length - 1][3] < 1) layers.push(parseColor(getComputedStyle(document.body).backgroundColor));
  let out = layers.pop();
  while (layers.length) { const top = layers.pop(); out = blend(top, out, top[3]); }
  return out;
}
function blend(fg, bg, a) { return [0, 1, 2].map(i => fg[i] * a + bg[i] * (1 - a)).concat([1]); }
function lum(c) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
