<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<!--ARTIFACT:BEGIN-->
<title>Munkaeszköz HUB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky tool header, one centred column (max 1040px); hub = tile grid, module = stacked work cards. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --surface-2: #eaeff4;
  --fg: #15202b;
  --muted: #54626f;
  --border: #d5dde5;
  --primary: #1857a8;
  --primary-fg: #ffffff;
  --focus: #1857a8;
  --warn: #9a4a00;
  --warn-bg: #fff2df;
  --danger: #b42318;
  --danger-bg: #fdecea;
  --ok: #17703f;
  --acc-space: #0d6a86;
  --acc-pull: #6940c4;
  --acc-freight: #985000;
  --acc-export: #237528;
  --acc-machine: #a12a62;
  --acc-tasks: #3349c0;
  --mode-user: #54626f;
  --mode-admin: #985000;
  --mode-dev: #6940c4;
  --shadow: 0 1px 2px rgba(21, 32, 43, .06), 0 4px 14px rgba(21, 32, 43, .06);
  --shadow-lift: 0 2px 4px rgba(21, 32, 43, .08), 0 12px 28px rgba(21, 32, 43, .12);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --radius-sm: 10px;
  --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #171f28; --surface-2: #202a35; --fg: #e7edf3; --muted: #9eabb8;
    --border: #2c3946; --primary: #6fa8f2; --primary-fg: #08121e; --focus: #8fbcf6;
    --warn: #f5b04c; --warn-bg: #352512; --danger: #ff8a7f; --danger-bg: #3a1a17; --ok: #62d394;
    --acc-space: #5cc8e6; --acc-pull: #b9a2ff; --acc-freight: #f2ab4f; --acc-export: #74d07a; --acc-machine: #f48fc2; --acc-tasks: #9cadff;
    --mode-user: #9eabb8; --mode-admin: #f2ab4f; --mode-dev: #b9a2ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lift: 0 10px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #171f28; --surface-2: #202a35; --fg: #e7edf3; --muted: #9eabb8;
  --border: #2c3946; --primary: #6fa8f2; --primary-fg: #08121e; --focus: #8fbcf6;
  --warn: #f5b04c; --warn-bg: #352512; --danger: #ff8a7f; --danger-bg: #3a1a17; --ok: #62d394;
  --acc-space: #5cc8e6; --acc-pull: #b9a2ff; --acc-freight: #f2ab4f; --acc-export: #74d07a; --acc-machine: #f48fc2; --acc-tasks: #9cadff;
  --mode-user: #9eabb8; --mode-admin: #f2ab4f; --mode-dev: #b9a2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lift: 0 10px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 16px; line-height: 1.5; margin: 0; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a.brand, a.tile, a.btn { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }

.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.app-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.app-header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; margin-right: auto; min-width: 0; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.brand svg { width: 30px; height: 30px; color: var(--primary); flex: none; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.seg button { min-width: 44px; min-height: 40px; border: 0; background: transparent; border-radius: 999px; padding: 0 10px; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg button svg { width: 20px; height: 20px; }
.icon-btn { position: relative; width: var(--tap); height: var(--tap); border-radius: 999px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn:hover { background: var(--surface-2); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: var(--surface); font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.mode-pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px 0 12px; min-height: 46px; background: var(--surface-2); }
.mode-pick .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mode-color, var(--mode-user)); flex: none; }
.mode-pick select { border: 0; background: transparent; font-weight: 600; min-height: 40px; padding-right: 4px; cursor: pointer; }
.mode-user { --mode-color: var(--mode-user); }
.mode-admin { --mode-color: var(--mode-admin); }
.mode-dev { --mode-color: var(--mode-dev); }
.mode-pick .lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Main */
main { padding-block: 20px 32px; }
.view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
.view-head h1 { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 1.9rem); }
.view-head .sub { color: var(--muted); flex-basis: 100%; }
.storage-warn { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }

/* Hub tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.tile { --acc: var(--primary); position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; text-align: left; padding: 22px; min-height: 220px; border-radius: var(--radius); background: var(--surface); border: 2px solid color-mix(in srgb, var(--acc) 55%, var(--border)); box-shadow: var(--shadow); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.tile .tile-icon { width: 84px; height: 84px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--acc) 12%, var(--surface)); color: var(--acc); }
.tile .tile-icon svg { width: 64px; height: 64px; }
.tile h2 { font-size: 1.25rem; }
.tile p { color: var(--muted); }
.tile .chip { margin-top: auto; }
.tile.ready:hover, .tile.ready:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--acc); }
.tile.ready:active { transform: translateY(-1px); }
.tile.soon { cursor: default; box-shadow: none; border-style: dashed; background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.tile.soon h2, .tile.soon p { opacity: .7; }
.tile.soon .tile-icon { opacity: .8; }
.acc-space { --acc: var(--acc-space); }
.acc-pull { --acc: var(--acc-pull); }
.acc-freight { --acc: var(--acc-freight); }
.acc-export { --acc: var(--acc-export); }
.acc-machine { --acc: var(--acc-machine); }
.acc-tasks { --acc: var(--acc-tasks); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.go { background: color-mix(in srgb, var(--acc) 14%, var(--surface)); color: var(--acc); }
.chip.demo { background: color-mix(in srgb, var(--acc-pull) 16%, var(--surface)); color: var(--acc-pull); }

/* Buttons */
.btn { min-height: var(--tap); padding: 0 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.big { min-height: 56px; font-size: 1.1rem; padding: 0 26px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Cards & module layout */
.module-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .module-grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card h2 { font-size: 1.1rem; margin-bottom: 12px; }
.card .hint { color: var(--muted); font-size: .9rem; }
.card.role-admin { border-top: 4px solid var(--mode-admin); }
.card.role-dev { border-top: 4px solid var(--mode-dev); }
.card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title-row h2 { margin: 0; }

.display { border-radius: 12px; background: var(--fg); color: var(--bg); padding: 14px 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-bottom: 16px; }
.display .d-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; align-self: flex-start; }
.display .d-value { font-family: var(--font-num); font-size: clamp(2.8rem, 2rem + 4vw, 4rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.display .d-note { font-size: .85rem; min-height: 1.3em; opacity: .85; }

.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
.date-row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 14px; }
input[type="date"], input[type="text"], input[type="number"], textarea, select.plain { min-height: var(--tap); padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
textarea { padding: 10px 12px; width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }

.rows { display: grid; gap: 10px; margin-bottom: 16px; }
.row-item { display: grid; grid-template-columns: minmax(0, 1fr) 140px; align-items: center; gap: 4px 12px; padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; }
.row-item label { font-weight: 600; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
.row-item input { width: 100%; min-height: 54px; font-size: 1.5rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; border: 2px solid var(--border); border-radius: 12px; padding: 0 14px; background: var(--surface); }
.row-item .msg { grid-column: 1 / -1; font-size: .9rem; font-weight: 600; min-height: 0; }
.row-item.dev-flag { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.row-item.dev-flag input { border-color: var(--warn); color: var(--warn); }
.row-item.dev-flag .msg { color: var(--warn); }
.row-item.invalid input { border-color: var(--danger); }
.row-item.invalid .msg { color: var(--danger); }

.history { display: grid; gap: 6px; max-height: 420px; overflow-y: auto; }
.hist-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: var(--tap); padding: 6px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.hist-item:hover { background: var(--surface-2); }
.hist-item .h-date { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hist-item .h-total { font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

.manage-list { display: grid; gap: 8px; margin-bottom: 12px; }
.manage-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.manage-row input { flex: 1 1 140px; min-width: 0; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.inline-form input { flex: 1 1 140px; min-width: 0; }
.sep { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

table.kv { width: 100%; border-collapse: collapse; }
table.kv th, table.kv td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.kv th { color: var(--muted); font-weight: 600; width: 45%; }
table.kv td { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tbl-scroll { overflow-x: auto; }

.test-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
.test-list li { display: flex; gap: 8px; align-items: baseline; font-size: .92rem; }
.test-list .pass { color: var(--ok); font-weight: 700; }
.test-list .fail { color: var(--danger); font-weight: 700; }
.test-summary { font-weight: 700; margin-top: 12px; }

/* Modal */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 20, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .modal-back { align-items: center; } }
.modal { width: min(560px, 100%); max-height: min(86vh, 760px); overflow-y: auto; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-lift); padding: 20px; display: grid; gap: 14px; }
.modal h2 { font-size: 1.2rem; }
.modal .m-body { display: grid; gap: 10px; }
.modal .m-body ul { margin: 0; padding-left: 20px; }
.modal .m-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.notice-warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.notice-err { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.notif-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.notif-item.unread { border-left: 4px solid var(--primary); }
.notif-item time { color: var(--muted); font-size: .8rem; }

.toast-zone { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; box-shadow: var(--shadow-lift); }
.toast.err { background: var(--danger); color: var(--surface); }

/* 0.2.0: napló, feladatok, mai teendők */
.btn.small { min-height: 40px; padding: 0 12px; font-size: .9rem; border-radius: 10px; }
.prev-hint { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
.prev-hint:empty, .row-item .msg:empty { display: none; }
.hist-item .h-count { font-weight: 600; color: var(--muted); }
.today-card { margin-bottom: 18px; border-top: 4px solid var(--acc-tasks); }
.today-card h2 { margin: 0; }
.today-date { font-weight: 500; color: var(--muted); font-size: .95rem; }
.task-list { display: grid; gap: 8px; }
.task-item { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.task-item.st-late { border-left: 4px solid var(--danger); }
.task-item.st-done { border-left: 4px solid var(--ok); }
.task-item.st-skipped { opacity: .8; border-style: dashed; }
.task-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.task-main input[type="checkbox"] { width: 28px; height: 28px; accent-color: var(--ok); flex: none; cursor: pointer; }
.task-name { font-weight: 600; font-size: 1.05rem; flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.st-done .task-name { text-decoration: line-through; color: var(--muted); }
.task-meta { color: var(--muted); font-size: .88rem; padding-left: 38px; }
.task-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 38px; }
.task-actions:empty { display: none; }
.chip.st-due { background: color-mix(in srgb, var(--primary) 14%, var(--surface)); color: var(--primary); }
.chip.st-done { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.chip.st-skipped { background: var(--surface-2); color: var(--muted); }
.chip.st-late, .chip.st-missed { background: var(--danger-bg); color: var(--danger); }
.day-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.icon-btn.flip svg { transform: scaleX(-1); }
.day-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }
.hist-day { border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; }
.hist-day summary { min-height: var(--tap); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; cursor: pointer; }
.hist-day .h-sum { color: var(--muted); font-size: .88rem; }
.hist-tasks { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.manage-task { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--border); }
.manage-task .mt-text { display: grid; min-width: 0; flex: 1 1 200px; }
.flabel { font-weight: 600; }
.day-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.day-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
.day-pill input { width: 18px; height: 18px; }
input[type="time"] { min-height: var(--tap); padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.modal .field select.plain { width: 100%; }
footer.app-footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }
footer.app-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-block: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile.ready:hover, .tile.ready:focus-visible { transform: none; } }
</style>

<header class="app-header" id="app-header"></header>
<main id="app-main" class="wrap" tabindex="-1"></main>
<footer class="app-footer" id="app-footer"></footer>
<div class="toast-zone" id="toast-zone" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
(function () {
'use strict';

/* =====================================================================
 * 1. ALAPBEÁLLÍTÁSOK
 * ===================================================================== */
const VERSION = '0.2.0';
const APP_ID = 'munkaeszkoz-hub';
const STORAGE_PREFIX = 'mhub.v1.';
const LANGS = ['en', 'hu', 'uk'];
const THEMES = ['system', 'light', 'dark'];
const MODES = ['user', 'admin', 'dev'];
const DEFAULT_PREFS = { lang: 'en', theme: 'system', mode: 'user' };

/* =====================================================================
 * 2. JOGOSULTSÁGI TÁBLÁZAT (módok × funkciók) – itt módosítható.
 *    FIGYELEM: ez nem biztonsági funkció, bárki átválthat módot.
 * ===================================================================== */
const PERMISSIONS = {
  //                 Felhasználó  Admin        Fejlesztő
  'entry.edit':     { user: true,  admin: true,  dev: true },  // számok bevitele
  'entry.save':     { user: true,  admin: true,  dev: true },  // nap mentése
  'history.view':   { user: true,  admin: true,  dev: true },  // előző napok
  'data.export':    { user: true,  admin: true,  dev: true },  // mentés fájlba
  'data.import':    { user: false, admin: true,  dev: true },  // betöltés fájlból
  'rows.manage':    { user: false, admin: true,  dev: true },  // sorok kezelése
  'threshold.edit': { user: false, admin: true,  dev: true },  // eltérésküszöb
  'data.clearAll':  { user: false, admin: true,  dev: true },  // mentett adatok törlése

}

    'guide.exportPallets': 'Írd be kategóriánként a raklapok számát. Csak egész szám, 0 vagy több; a már átszámolt értéket írd be. Az összeg gépelés közben frissül.\nA „Nap mentése” a kiválasztott dátumra menti a számolást. Egy napra egy bejegyzés lehet: ha a nap már létezik, felülírás előtt rákérdez.\nHa egy kategória az előző mentett naphoz képest jobban eltér a küszöbnél, a mező narancssárga lesz. Mentés előtt megerősítést kér.\nA „Másolás üzenetként” egy rövid sort tesz a vágólapra a dátummal és az összeggel.\nEnnek a modulnak az adatai a többitől külön tárolódnak és külön exportálandók.\nAdmin mód: kategóriák kezelése, küszöb, import, mentett adatok törlése. Fejlesztő mód: demó adat.',

    'hub.today.all': 'Усі завдання',

function memoryBackend() {
  const m = new Map();
  return {
    getItem: k => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => { m.set(k, String(v)); },
    removeItem: k => { m.delete(k); }
  };
}
function detectLocalStorage() {
  try {
    const ls = window.localStorage;
    const k = STORAGE_PREFIX + '__probe';
    ls.setItem(k, '1');
    ls.removeItem(k);
    return ls;
  } catch (e) { return null; }
}
function createStore(backend, persistent) {
  return {
    persistent: !!persistent,
    lastError: null,
    read(key, fallback) {
      try {
        const raw = backend.getItem(STORAGE_PREFIX + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    write(key, value) {
      try { backend.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); this.lastError = null; return true; }
      catch (e) { this.lastError = e; return false; }
    },
    remove(key) { try { backend.removeItem(STORAGE_PREFIX + key); } catch (e) { /* ignore */ } }
  };
}

/* =====================================================================
 * 6. ÉRTESÍTÉSI KÖZPONT – egyelőre üres; később NotificationCenter.add()-dal
 *    lehet bejegyzést adni: { title | titleKey, body | bodyKey, date? }.
 * ===================================================================== */
function createNotificationCenter(store) {
  const KEY = 'notifications';
  const listeners = new Set();
  function all() { const l = store.read(KEY, []); return Array.isArray(l) ? l : []; }
  function persist(list) { store.write(KEY, list); listeners.forEach(fn => fn()); }
  return {
    list: () => all().slice().sort((a, b) => String(b.date).localeCompare(String(a.date))),
    unreadCount: () => all().filter(n => !n.read).length,
    add(n) {
      const item = {
        id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        date: n.date || new Date().toISOString(),
        title: n.title || null, titleKey: n.titleKey || null,
        body: n.body || null, bodyKey: n.bodyKey || null,
        read: false
      };
      persist(all().concat([item]));
      return item.id;
    },
    markAllRead() { persist(all().map(n => Object.assign({}, n, { read: true }))); },
    clear() { persist([]); },
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isValidIsoDate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function fmtDate(iso, lang) {
  if (!isValidIsoDate(iso)) return String(iso);
  const [y, m, d] = iso.split('-').map(Number);
  try { return new Date(y, m - 1, d).toLocaleDateString(LOCALE[lang], { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' }); }
  catch (e) { return iso; }
}
function fmtDateTime(isoStr, lang) {
  const d = new Date(isoStr);
  if (isNaN(d)) return '—';
  try { return d.toLocaleString(LOCALE[lang], { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return d.toISOString(); }
}

  }
  function sortedDays(days) { return days.slice().sort((a, b) => b.date.localeCompare(a.date)); }
  // Az utolsó mentett nap, ami a megadott dátum előtt van.
  function previousDay(days, date) {
    return sortedDays(days).find(d => d.date < date) || null;
  }
  function prevValueFor(prevDay, row) {
    if (!prevDay) return null;
    const hit = prevDay.rows.find(r => r.id != null && r.id === row.id) || prevDay.rows.find(r => r.name === row.name);
    return hit ? hit.value : null;
  }
  // Eltérés: |most − előző| > küszöb  →  jelölés
  function deviation(prev, now, threshold) {
    if (prev == null || !Number.isInteger(now)) return null;
    const diff = now - prev;
    return { prev, now, diff, flagged: Math.abs(diff) > threshold };
  }
  function buildDay(state, date, values, savedAt) {
    const rows = state.rows.map(r => ({ id: r.id, name: r.name, value: values[r.id] }));
    return { date, rows, total: sum(rows.map(r => r.value)), savedAt: savedAt || new Date().toISOString() };
  }
  function upsertDay(state, day) {
    const existing = state.days.find(d => d.date === day.date) || null;
    const days = state.days.filter(d => d.date !== day.date).concat([day]);
    return { state: Object.assign({}, state, { days }), overwritten: existing };
  }

  // Export / import
  function buildExport(state, now) {
    return {
      app: APP_ID, module: 'empty-space', schema: SCHEMA,
      exportedAt: (now || new Date()).toISOString(),
      threshold: state.threshold,
      days: sortedDays(state.days).map(d => {
        const out = { date: d.date, rows: d.rows.map(r => ({ id: r.id, name: r.name, value: r.value })), total: d.total, savedAt: d.savedAt };
        if (d.demo) out.demo = true;
        return out;
      })
    };
  }
  function validateImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'json' }; }
    if (!obj || typeof obj !== 'object' || obj.app !== APP_ID || obj.module !== 'empty-space' ||
        typeof obj.schema !== 'number' || obj.schema > SCHEMA || !Array.isArray(obj.days)) {
      return { ok: false, error: 'format' };
    }
    const seen = new Set();
    const days = [];
    for (let i = 0; i < obj.days.length; i++) {
      const d = obj.days[i];
      const fail = reason => ({ ok: false, error: 'day', index: i + 1, reason });
      if (!d || typeof d !== 'object' || !isValidIsoDate(d.date)) return fail('date');
      if (seen.has(d.date)) return fail('duplicate');
      seen.add(d.date);
      if (!Array.isArray(d.rows) || d.rows.some(r => !r || typeof r.name !== 'string' || r.name.trim() === '')) return fail('rows');
      if (d.rows.some(r => !Number.isInteger(r.value) || r.value < 0 || r.value > MAX)) return fail('value');
      const total = sum(d.rows.map(r => r.value));
      if (d.total !== total) return fail('total');
      const day = {
        date: d.date,
        rows: d.rows.map(r => ({ id: r.id != null ? String(r.id) : null, name: r.name, value: r.value })),
        total,
        savedAt: typeof d.savedAt === 'string' ? d.savedAt : new Date().toISOString()
      };
      if (d.demo === true) day.demo = true;
      days.push(day);
    }
    return { ok: true, days };
  }
  function mergeImport(state, days) {
    const incoming = new Set(days.map(d => d.date));
    const overwrite = state.days.filter(d => incoming.has(d.date)).length;
    return { state: Object.assign({}, state, { days: state.days.filter(d => !incoming.has(d.date)).concat(days) }), overwrite };
  }

  // Demó adat (fiktív, jelölt). Saját mentést soha nem ír felül.
  function generateDemo(state, today, count) {
    count = count || 10;
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const base = state.rows.map((r, i) => 8 + i * 3);
    const taken = new Set(state.days.map(d => d.date));
    const added = [];
    for (let i = count; i >= 1; i--) {
      const date = addDays(today, -i);
      const values = {};
      state.rows.forEach((r, j) => {
        let v = base[j] + Math.round((rnd() - 0.5) * 6);
        if (i === 3 && j === 1) v += 12;   // szándékos nagy ugrás az eltérésjelzéshez
        if (i === 2 && j === 3) v = Math.max(0, v - 9);
        values[r.id] = Math.max(0, v);
      });
      if (taken.has(date)) continue;
      const day = buildDay(state, date, values, new Date().toISOString());
      day.demo = true;
      added.push(day);
    }
    return { state: Object.assign({}, state, { days: state.days.concat(added) }), added: added.length };
  }
  function clearDemo(state) {
    const keep = state.days.filter(d => !d.demo);
    return { state: Object.assign({}, state, { days: keep }), removed: state.days.length - keep.length };
  }
  function clearAll(state) { return Object.assign({}, state, { days: [] }); }

  function addRow(state, name) {
    const n = String(name || '').trim();
    if (!n) return { error: 'empty' };
    if (state.rows.some(r => r.name.toLowerCase() === n.toLowerCase())) return { error: 'duplicate' };
    let k = state.rows.length + 1;
    while (state.rows.some(r => r.id === 'r' + k)) k++;
    return { state: Object.assign({}, state, { rows: state.rows.concat([{ id: 'r' + k, name: n }]) }) };
  }
  function renameRow(state, id, name) {
    const n = String(name || '').trim();
    if (!n) return { error: 'empty' };
    if (state.rows.some(r => r.id !== id && r.name.toLowerCase() === n.toLowerCase())) return { error: 'duplicate' };
    return { state: Object.assign({}, state, { rows: state.rows.map(r => (r.id === id ? { id: r.id, name: n } : r)) }) };
  }
  function deleteRow(state, id) {
    const draft = Object.assign({}, state.draft); delete draft[id];
    return { state: Object.assign({}, state, { rows: state.rows.filter(r => r.id !== id), draft }) };
  }
  function lastSaveTime(state) {
    const real = state.days.map(d => d.savedAt).filter(Boolean).sort();
    return real.length ? real[real.length - 1] : null;
  }

  return { KEY, defaults, load, save, parseCount, sum, sortedDays, previousDay, prevValueFor, deviation,
    buildDay, upsertDay, buildExport, validateImport, mergeImport, generateDemo, clearDemo, clearAll,
    addRow, renameRow, deleteRow, lastSaveTime };
})();

/* =====================================================================
 * 10. MODUL: ÜRES HELY SZÁMOLÁS – felület
 * ===================================================================== */
function renderEmptySpace(root, ctx) {
  const { t, mode, store } = ctx;
  let state = EmptySpace.load(store);
  const perm = f => can(mode, f);
  const draftDate = (state.draft && isValidIsoDate(state.draft.__date)) ? state.draft.__date : ctx.today();
  let date = draftDate;

  function persist(next) {
    state = next;
    if (!EmptySpace.save(store, state)) ctx.toast(t('storage.writeFailed'), true);
  }
  function rawValue(id) { const v = state.draft[id]; return v == null ? '' : String(v); }
  function setDraft(id, val) {
    state.draft = Object.assign({}, state.draft, { [id]: val });
    EmptySpace.save(store, state);
  }

  const totalEl = h('div', { class: 'd-value', id: 'es-total', 'aria-live': 'polite' }, '0');
  const totalNote = h('div', { class: 'd-note', id: 'es-total-note' });
  const prevRef = h('p', { class: 'hint', id: 'es-prev-ref' });
  const rowEls = {};

  function evaluate() {
    const prevDay = EmptySpace.previousDay(state.days, date);
    let invalid = 0;
    const values = {};
    const flags = [];
    state.rows.forEach(row => {
      const p = EmptySpace.parseCount(rawValue(row.id));
      const el = rowEls[row.id];
      const touched = rawValue(row.id) !== '';
      el.wrap.classList.remove('invalid', 'dev-flag');
      el.msg.textContent = '';
      el.input.removeAttribute('aria-invalid');
      if (!p.ok) {
        invalid++;
        if (touched) {
          el.wrap.classList.add('invalid');
          el.input.setAttribute('aria-invalid', 'true');
          el.msg.textContent = t('es.err.' + p.error);
        }
        return;
      }
      values[row.id] = p.value;
      const dev = EmptySpace.deviation(EmptySpace.prevValueFor(prevDay, row), p.value, state.threshold);
      if (dev && dev.flagged) {
        el.wrap.classList.add('dev-flag');
        el.msg.textContent = t('es.deviation', { diff: signed(dev.diff) });
        flags.push({ row, dev });
      }
    });
    totalEl.textContent = String(EmptySpace.sum(Object.values(values)));
    const shown = state.rows.filter(r => rawValue(r.id) !== '' && !EmptySpace.parseCount(rawValue(r.id)).ok).length;
    totalNote.textContent = shown ? t('es.invalidCount', { n: shown }) : '';
    prevRef.textContent = prevDay ? t('es.prevRef', { date: fmtDate(prevDay.date, ctx.lang) }) : t('es.prevNone');
    return { invalid, values, flags, prevDay };
  }

  async function onSave() {
    if (!isValidIsoDate(date)) { ctx.toast(t('es.badDate'), true); return; }
    const ev = evaluate();
    if (ev.invalid > 0 || state.rows.length === 0) {
      state.rows.forEach(r => { if (rawValue(r.id) === '') { rowEls[r.id].wrap.classList.add('invalid'); rowEls[r.id].msg.textContent = t('es.err.empty'); } });
      ctx.toast(t('es.fixErrors'), true);
      return;
    }
    const existing = state.days.find(d => d.date === date);
    if (existing || ev.flags.length) {
      const body = [];
      if (existing) body.push(h('p', { class: 'notice-warn' }, t('es.confirm.overwrite', { date: fmtDate(date, ctx.lang), total: existing.total })));
      if (ev.flags.length) {
        body.push(h('p', null, t('es.confirm.deviation', { date: fmtDate(ev.prevDay.date, ctx.lang), threshold: state.threshold })));
        body.push(h('ul', null, ev.flags.map(f => h('li', null, t('es.confirm.devLine', { row: f.row.name, prev: f.dev.prev, now: f.dev.now, diff: signed(f.dev.diff) })))));
      }
      body.push(h('p', { class: 'hint' }, t('es.confirm.sure')));
      const ok = await ctx.modal({ title: t('es.confirm.title'), body, actions: [
        { label: t('btn.cancel'), value: false },
        { label: t('es.confirm.save'), value: true, kind: 'primary', id: 'es-confirm-save' }
      ] });
      if (!ok) return;
    }
    const day = EmptySpace.buildDay(state, date, ev.values);
    const res = EmptySpace.upsertDay(state, day);
    res.state.draft = {};
    persist(res.state);
    ctx.toast(t('es.saved', { date: fmtDate(date, ctx.lang), total: day.total }));
    ctx.rerender();
  }

  // ---- Számolás kártya
  const dateInput = h('input', { type: 'date', id: 'es-date', value: date, onchange: e => {
    date = e.target.value; setDraft('__date', date); evaluate(); } });
  const countCard = h('section', { class: 'card', 'aria-labelledby': 'es-count-h' },
    h('div', { class: 'display' },
      h('div', { class: 'd-label' }, t('es.total')), totalEl, totalNote),
    h('div', { class: 'date-row' },
      h('div', { class: 'field' }, h('label', { for: 'es-date' }, t('es.date')), dateInput),
      prevRef),
    h('h2', { id: 'es-count-h', class: 'sr-only' }, t('es.today')),
    state.rows.length ? null : h('p', { class: 'empty' }, t('es.noRows')),
    h('div', { class: 'rows' }, state.rows.map(row => {
      const id = 'es-in-' + row.id;
      const input = h('input', { id, type: 'text', inputmode: 'numeric', autocomplete: 'off', enterkeyhint: 'next',
        'data-row': row.id, 'data-perm': 'entry.edit', value: rawValue(row.id), 'aria-describedby': id + '-msg',
        oninput: e => { setDraft(row.id, e.target.value); evaluate(); } });
      const msg = h('div', { class: 'msg', id: id + '-msg' });
      const wrap = h('div', { class: 'row-item' }, h('label', { for: id }, row.name), input, msg);
      rowEls[row.id] = { input, msg, wrap };
      return wrap;
    })),
    h('div', { class: 'btn-row' },
      perm('entry.save') ? h('button', { class: 'btn primary big', id: 'es-save', 'data-perm': 'entry.save', onclick: onSave },
        icon('save'), t('es.save')) : null,
      // 0.2.0: másolás üzenetként (csak olvas, nem ír a tárolóba)
      perm('entry.copy') ? h('button', { class: 'btn big', id: 'es-copy', 'data-perm': 'entry.copy', onclick: () =>
        ctx.copyMessage(buildCopyMessage(date, t('mod.emptySpace.title'), EmptySpace.sum(Object.values(evaluate().values)))) },
        icon('copy'), t('dl.copyMsg')) : null),
    perm('threshold.edit') ? null : h('p', { class: 'hint', style: 'margin-top:12px' }, t('es.threshold.readonly', { n: state.threshold }))
  );

  // ---- Előző napok
  const historyCard = perm('history.view') ? h('section', { class: 'card', 'data-perm': 'history.view' },
    h('h2', null, t('es.history')),
    state.days.length ? h('div', { class: 'history', id: 'es-history' }, EmptySpace.sortedDays(state.days).map(d =>
      h('button', { class: 'hist-item', 'data-date': d.date, onclick: () => showDay(d) },
        h('span', { class: 'h-date' }, fmtDate(d.date, ctx.lang), d.demo ? h('span', { class: 'chip demo' }, t('es.demo')) : null),
        h('span', { class: 'h-total' }, String(d.total))))) :
      h('p', { class: 'empty', id: 'es-history-empty' }, t('es.history.empty'))
  ) : null;

  function showDay(d) {
    ctx.modal({
      title: t('es.history.detail', { date: fmtDate(d.date, ctx.lang) }),
      body: [
        d.demo ? h('span', { class: 'chip demo' }, t('es.demo')) : null,
        h('div', { class: 'tbl-scroll' }, h('table', { class: 'kv' },
          h('thead', null, h('tr', null, h('th', null, t('es.history.row')), h('th', null, t('es.history.value')))),
          h('tbody', null, d.rows.map(r => h('tr', null, h('td', null, r.name), h('td', null, String(r.value)))),
            h('tr', null, h('th', null, t('es.total')), h('td', null, h('strong', null, String(d.total))))))),
        h('p', { class: 'hint' }, t('es.history.savedAt', { time: fmtDateTime(d.savedAt, ctx.lang) }))
      ],
      actions: [{ label: t('btn.close'), value: true, kind: 'primary' }]
    });
  }

  // ---- Export / import
  async function onExport() {
    if (!state.days.length) { ctx.toast(t('es.export.empty'), true); return; }
    const data = EmptySpace.buildExport(state);
    const text = JSON.stringify(data, null, 2);
    const file = 'ures-hely-' + ctx.today() + '.json';
    const ta = h('textarea', { id: 'es-export-text', readonly: true, rows: 8 }, text);
    ctx.modal({
      title: t('es.export.title'),
      body: [
        h('p', null, t('es.export.ready', { file, n: data.days.length })),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn primary', id: 'es-export-save', onclick: () => ctx.saveFile(file, text) }, icon('download'), t('es.export.download')),
          h('button', { class: 'btn', onclick: () => ctx.copyText(text, ta) }, t('es.export.copy'))),
        h('p', { class: 'hint' }, t('es.export.textHint')),
        ta
      ],
      actions: [{ label: t('btn.close'), value: true }]
    });
  }
  function onImport() {
    const fileIn = h('input', { type: 'file', id: 'es-import-file', accept: '.json,application/json' });
    const ta = h('textarea', { id: 'es-import-text', rows: 6 });
    const err = h('p', { class: 'notice-err', id: 'es-import-error', hidden: true });
    const showErr = msg => { err.textContent = msg; err.hidden = false; };
    async function check() {
      err.hidden = true;
      let text = ta.value.trim();
      if (fileIn.files && fileIn.files[0]) {
        try { text = await fileIn.files[0].text(); } catch (e) { showErr(t('es.import.err.read')); return; }
      }
      if (!text) { showErr(t('es.import.noInput')); return; }
      const res = EmptySpace.validateImport(text);
      if (!res.ok) { showErr(importErrorText(t, res)); return; }
      const merged = EmptySpace.mergeImport(state, res.days);
      ctx.closeModal(null);
      const ok = await ctx.modal({ title: t('es.import.title'),
        body: [h('p', null, t('es.import.summary', { n: res.days.length, overwrite: merged.overwrite }))],
        actions: [{ label: t('btn.cancel'), value: false }, { label: t('es.import.confirm'), value: true, kind: 'primary', id: 'es-import-confirm' }] });
      if (!ok) return;
      persist(merged.state);
      ctx.toast(t('es.import.done', { n: res.days.length }));
      ctx.rerender();
    }
    ctx.modal({
      title: t('es.import.title'),
      body: [
        h('div', { class: 'field' }, h('label', { for: 'es-import-file' }, t('es.import.choose')), fileIn),
        h('div', { class: 'field' }, h('label', { for: 'es-import-text' }, t('es.import.paste')), ta),
        err
      ],
      actions: [{ label: t('btn.cancel'), value: false }, { label: t('es.import.check'), kind: 'primary', id: 'es-import-check', onClick: check, keepOpen: true }]
    });
  }
  const backupCard = (perm('data.export') || perm('data.import')) ? h('section', { class: 'card' },
    h('h2', null, t('es.backup')),
    h('p', { class: 'hint', style: 'margin-bottom:12px' }, t('es.backup.hint')),
    h('div', { class: 'btn-row' },
      perm('data.export') ? h('button', { class: 'btn', id: 'es-export', 'data-perm': 'data.export', onclick: onExport }, icon('download'), t('es.export')) : null,
      perm('data.import') ? h('button', { class: 'btn', id: 'es-import', 'data-perm': 'data.import', onclick: onImport }, icon('upload'), t('es.import')) : null)
  ) : null;

  // ---- Admin
  let adminCard = null;
  if (perm('rows.manage') || perm('threshold.edit') || perm('data.clearAll')) {
    const parts = [h('h2', null, t('es.admin'))];
    if (perm('threshold.edit')) {
      const thIn = h('input', { type: 'number', id: 'es-threshold', min: '0', step: '1', inputmode: 'numeric', value: String(state.threshold) });
      parts.push(h('div', { 'data-perm': 'threshold.edit' },
        h('div', { class: 'inline-form' },
          h('div', { class: 'field' }, h('label', { for: 'es-threshold' }, t('es.threshold')), thIn),
          h('button', { class: 'btn', id: 'es-threshold-save', onclick: () => {
            const p = EmptySpace.parseCount(thIn.value);
            if (!p.ok) { ctx.toast(t('es.err.' + p.error), true); return; }
            persist(Object.assign({}, state, { threshold: p.value }));
            ctx.toast(t('es.threshold.saved', { n: p.value }));
            ctx.rerender();
          } }, t('es.threshold.save'))),
        h('p', { class: 'hint', style: 'margin-top:6px' }, t('es.threshold.hint'))));
    }
    if (perm('rows.manage')) {
      const rowErr = code => ctx.toast(t('es.rows.err.' + code), true);
      const newIn = h('input', { type: 'text', id: 'es-row-new', autocomplete: 'off' });
      parts.push(h('hr', { class: 'sep' }), h('div', { 'data-perm': 'rows.manage' },
        h('h3', { style: 'font-size:1rem;margin-bottom:10px' }, t('es.rows')),
        h('div', { class: 'manage-list' }, state.rows.map(row => {
          const inp = h('input', { type: 'text', value: row.name, id: 'es-row-name-' + row.id, 'aria-label': t('btn.rename') + ': ' + row.name });
          return h('div', { class: 'manage-row' }, inp,
            h('button', { class: 'btn', onclick: () => {
              const r = EmptySpace.renameRow(state, row.id, inp.value);
              if (r.error) return rowErr(r.error);
              persist(r.state); ctx.toast(t('es.rows.renamed', { name: inp.value.trim() })); ctx.rerender();
            } }, t('btn.rename')),
            h('button', { class: 'btn danger', onclick: async () => {
              const ok = await ctx.confirm(t('btn.delete'), t('es.rows.confirmDelete', { name: row.name }), t('btn.delete'), true);
              if (!ok) return;
              persist(EmptySpace.deleteRow(state, row.id).state); ctx.toast(t('es.rows.deleted', { name: row.name })); ctx.rerender();
            } }, t('btn.delete')));
        })),
        h('div', { class: 'inline-form' },
          h('div', { class: 'field', style: 'flex:1 1 160px' }, h('label', { for: 'es-row-new' }, t('es.rows.new')), newIn),
          h('button', { class: 'btn', id: 'es-row-add', onclick: () => {
            const r = EmptySpace.addRow(state, newIn.value);
            if (r.error) return rowErr(r.error);
            persist(r.state); ctx.toast(t('es.rows.added', { name: newIn.value.trim() })); ctx.rerender();
          } }, t('btn.add')))));
    }
    if (perm('data.clearAll')) {
      parts.push(h('hr', { class: 'sep' }), h('button', { class: 'btn danger', id: 'es-clear-all', 'data-perm': 'data.clearAll', onclick: async () => {
        const ok = await ctx.confirm(t('es.clearAll'), t('es.clearAll.confirm', { n: state.days.length }), t('btn.delete'), true);
        if (!ok) return;
        persist(EmptySpace.clearAll(state)); ctx.toast(t('es.clearAll.done')); ctx.rerender();
      } }, t('es.clearAll')));
    }
    adminCard = h('section', { class: 'card role-admin' }, parts);
  }

  // ---- Fejlesztő
  let devCard = null;
  if (perm('demo.generate') || perm('demo.clear')) {
    devCard = h('section', { class: 'card role-dev' },
      h('h2', null, t('es.dev')),
      h('p', { class: 'hint', style: 'margin-bottom:12px' }, t('es.demo.hint')),
      h('div', { class: 'btn-row' },
        perm('demo.generate') ? h('button', { class: 'btn', id: 'es-demo-gen', 'data-perm': 'demo.generate', onclick: () => {
          const r = EmptySpace.generateDemo(state, ctx.today());
          persist(r.state); ctx.toast(t('es.demo.generated', { n: r.added })); ctx.rerender();
        } }, t('es.demo.generate')) : null,
        perm('demo.clear') ? h('button', { class: 'btn danger', id: 'es-demo-clear', 'data-perm': 'demo.clear', onclick: () => {
          const r = EmptySpace.clearDemo(state);
          persist(r.state); ctx.toast(t('es.demo.cleared', { n: r.removed })); ctx.rerender();
        } }, t('es.demo.clear')) : null,
        perm('system.view') ? h('a', { class: 'btn', href: '#system', 'data-perm': 'system.view' }, t('es.openSystem')) : null));
  }

  root.appendChild(h('div', { class: 'module-grid' },
    h('div', { class: 'col' }, countCard),
    h('div', { class: 'col' }, historyCard, backupCard, adminCard, devCard)));
  evaluate();
}

function importErrorText(t, res) {
  if (res.error === 'day') return t('es.import.err.day', { n: res.index, reason: t('es.import.reason.' + res.reason) });
  return t('es.import.err.' + res.error);
}

/* =====================================================================
 * 10/b. KÖZÖS SEGÉDEK (0.2.0)
 * ===================================================================== */
function weekdayOf(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }
function daysBetween(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function isValidTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
// "Másolás üzenetként" szöveg: "ÉÉÉÉ-HH-NN – <modul neve>: <érték>"
function buildCopyMessage(date, moduleName, value) { return date + ' – ' + moduleName + ': ' + value; }
function machineListText(rows) { return rows.map(r => r.name + ': ' + r.value).join('; '); }

/* =====================================================================
 * 10/c. KÖZÖS NAPI LISTA ELEM ("napló") – az Export raklap számolás és a
 *       Gépnapló használja. Minden példány KÜLÖN tárolási kulccsal, külön
 *       export fájllal és külön importtal dolgozik.
 *       Az Üres hely számolás (9–10. pont) szándékosan érintetlen maradt,
 *       hogy a 0.1.0 adatai és viselkedése ne változzon.
 *
 *  cfg: { key, moduleId, defaultRows, hasTotal, requireAll,
 *         check: 'threshold' | 'hours', thresholdDefault, demoSeries(nRows, nDays, rnd) }
 * ===================================================================== */
function createDayLog(cfg) {
  const SCHEMA = 1;
  const parse = raw => EmptySpace.parseCount(raw);   // ugyanaz a bevitel-szabály: nemnegatív egész
  const sum = values => values.reduce((a, v) => a + (Number.isInteger(v) && v >= 0 ? v : 0), 0);

  function defaults() {
    const s = { schema: SCHEMA, rows: cfg.defaultRows.map((name, i) => ({ id: 'r' + (i + 1), name })), days: [], draft: {} };
    if (cfg.check === 'threshold') s.threshold = cfg.thresholdDefault;
    return s;
  }
  function load(store) {
    const s = store.read(cfg.key, null);
    if (!s || typeof s !== 'object' || !Array.isArray(s.rows) || !Array.isArray(s.days)) return defaults();
    const out = {
      schema: SCHEMA,
      rows: s.rows.filter(r => r && typeof r.name === 'string').map(r => ({ id: String(r.id), name: r.name })),
      days: s.days.filter(d => d && isValidIsoDate(d.date) && Array.isArray(d.rows)),
      draft: (s.draft && typeof s.draft === 'object') ? s.draft : {}
    };
    if (cfg.check === 'threshold') out.threshold = Number.isInteger(s.threshold) && s.threshold >= 0 ? s.threshold : cfg.thresholdDefault;
    return out;
  }
  function save(store, state) { return store.write(cfg.key, state); }
  function sortedDays(days) { return days.slice().sort((a, b) => b.date.localeCompare(a.date)); }
  function previousDay(days, date) { return sortedDays(days).find(d => d.date < date) || null; }
  function rowHit(day, row) {
    return day.rows.find(r => r.id != null && r.id === row.id) || day.rows.find(r => r.name === row.name) || null;
  }
  // Az adott sor utolsó, korábbi mentett értéke (a Gépnaplónál gépenként keres vissza).
  function previousFor(days, row, date) {
    for (const d of sortedDays(days)) {
      if (d.date >= date) continue;
      const hit = rowHit(d, row);
      if (hit) return { date: d.date, value: hit.value };
    }
    return null;
  }
  // Eltérések: { [rowId]: { kind, prev, now, diff, prevDate, days } } – csak a jelzettek.
  function check(state, date, values) {
    const out = {};
    if (cfg.check === 'threshold') {
      const prevDay = previousDay(state.days, date);
      if (!prevDay) return out;
      state.rows.forEach(row => {
        const now = values[row.id];
        const hit = rowHit(prevDay, row);
        if (!hit || !Number.isInteger(now)) return;
        const diff = now - hit.value;
        if (Math.abs(diff) > state.threshold) out[row.id] = { kind: 'threshold', prev: hit.value, now, diff, prevDate: prevDay.date };
      });
      return out;
    }
    state.rows.forEach(row => {
      const now = values[row.id];
      if (!Number.isInteger(now)) return;
      const p = previousFor(state.days, row, date);
      if (!p) return;                                  // első mentés: nincs jelzés
      const days = daysBetween(p.date, date);
      const diff = now - p.value;
      if (diff < 0) out[row.id] = { kind: 'lower', prev: p.value, now, diff, prevDate: p.date, days };
      else if (diff > days * 24) out[row.id] = { kind: 'tooHigh', prev: p.value, now, diff, prevDate: p.date, days };
    });
    return out;
  }
  function buildDay(state, date, values, savedAt) {
    const rows = state.rows.filter(r => Number.isInteger(values[r.id])).map(r => ({ id: r.id, name: r.name, value: values[r.id] }));
    const day = { date, rows, savedAt: savedAt || new Date().toISOString() };
    if (cfg.hasTotal) day.total = sum(rows.map(r => r.value));
    return day;
  }
  function upsertDay(state, day) {
    const existing = state.days.find(d => d.date === day.date) || null;
    return { state: Object.assign({}, state, { days: state.days.filter(d => d.date !== day.date).concat([day]) }), overwritten: existing };
  }
  function buildExport(state, now) {
    const out = { app: APP_ID, module: cfg.moduleId, schema: SCHEMA, exportedAt: (now || new Date()).toISOString() };
    if (cfg.check === 'threshold') out.threshold = state.threshold;
    out.days = sortedDays(state.days).map(d => {
      const o = { date: d.date, rows: d.rows.map(r => ({ id: r.id, name: r.name, value: r.value })), savedAt: d.savedAt };
      if (cfg.hasTotal) o.total = d.total;
      if (d.demo) o.demo = true;
      return o;
    });
    return out;
  }
  function validateImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'json' }; }
    if (!obj || typeof obj !== 'object' || obj.app !== APP_ID || obj.module !== cfg.moduleId ||
        typeof obj.schema !== 'number' || obj.schema > SCHEMA || !Array.isArray(obj.days)) return { ok: false, error: 'format' };
    const seen = new Set(), days = [];
    for (let i = 0; i < obj.days.length; i++) {
      const d = obj.days[i];
      const fail = reason => ({ ok: false, error: 'day', index: i + 1, reason });
      if (!d || typeof d !== 'object' || !isValidIsoDate(d.date)) return fail('date');
      if (seen.has(d.date)) return fail('duplicate');
      seen.add(d.date);
      if (!Array.isArray(d.rows) || !d.rows.length || d.rows.some(r => !r || typeof r.name !== 'string' || r.name.trim() === '')) return fail('rows');
      if (d.rows.some(r => !Number.isInteger(r.value) || r.value < 0 || r.value > 100000)) return fail('value');
      const day = { date: d.date, rows: d.rows.map(r => ({ id: r.id != null ? String(r.id) : null, name: r.name, value: r.value })),
        savedAt: typeof d.savedAt === 'string' ? d.savedAt : new Date().toISOString() };
      if (cfg.hasTotal) {
        const total = sum(d.rows.map(r => r.value));
        if (d.total !== total) return fail('total');
        day.total = total;
      }
      if (d.demo === true) day.demo = true;
      days.push(day);
    }
    return { ok: true, days };
  }
  function mergeImport(state, days) {
    const incoming = new Set(days.map(d => d.date));
    const overwrite = state.days.filter(d => incoming.has(d.date)).length;
    return { state: Object.assign({}, state, { days: state.days.filter(d => !incoming.has(d.date)).concat(days) }), overwrite };
  }
  function generateDemo(state, today, count) {
    count = count || 10;
    let seed = 11;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const series = cfg.demoSeries(state.rows.length, count, rnd);   // [napIndex a legrégebbitől][sor]
    const taken = new Set(state.days.map(d => d.date));
    const added = [];
    for (let i = 0; i < count; i++) {
      const date = addDays(today, -(count - i));
      if (taken.has(date)) continue;
      const values = {};
      state.rows.forEach((r, j) => { values[r.id] = Math.max(0, series[i][j]); });
      const day = buildDay(state, date, values);
      day.demo = true;
      added.push(day);
    }
    return { state: Object.assign({}, state, { days: state.days.concat(added) }), added: added.length };
  }
  function clearDemo(state) {
    const keep = state.days.filter(d => !d.demo);
    return { state: Object.assign({}, state, { days: keep }), removed: state.days.length - keep.length };
  }
  function clearAll(state) { return Object.assign({}, state, { days: [] }); }
  const addRow = (state, name) => EmptySpace.addRow(state, name);
  const renameRow = (state, id, name) => EmptySpace.renameRow(state, id, name);
  const deleteRow = (state, id) => EmptySpace.deleteRow(state, id);
  function lastSaveTime(state) {
    const all = state.days.map(d => d.savedAt).filter(Boolean).sort();
    return all.length ? all[all.length - 1] : null;
  }
  return { cfg, KEY: cfg.key, defaults, load, save, parse, sum, sortedDays, previousDay, previousFor, check, buildDay, upsertDay,
    buildExport, validateImport, mergeImport, generateDemo, clearDemo, clearAll, addRow, renameRow, deleteRow, lastSaveTime };
}

const ExportPallets = createDayLog({
  key: 'exportPallets', moduleId: 'export-pallets', defaultRows: ['A kategória', 'B kategória', 'C kategória'],
  hasTotal: true, requireAll: true, check: 'threshold', thresholdDefault: 5,
  demoSeries(n, days, rnd) {
    const out = [];
    for (let i = 0; i < days; i++) {
      out.push(Array.from({ length: n }, (_, j) => {
        let v = 6 + j * 4 + Math.round((rnd() - 0.5) * 6);
        if (i === days - 3 && j === 0) v += 11;        // szándékos ugrás az eltérésjelzéshez
        return v;
      }));
    }
    return out;
  }
});
const MachineLog = createDayLog({
  key: 'machineLog', moduleId: 'machine-log', defaultRows: ['N10', 'N11', 'N12'],
  hasTotal: false, requireAll: false, check: 'hours',
  demoSeries(n, days, rnd) {
    const cur = Array.from({ length: n }, (_, j) => 1000 + j * 350);
    const out = [];
    for (let i = 0; i < days; i++) {
      for (let j = 0; j < n; j++) {
        cur[j] += 6 + Math.round(rnd() * 12);
        if (i === days - 4 && j === 1) cur[j] -= 40;    // szándékos csökkenés
        if (i === days - 2 && j === 2) cur[j] += 50;    // szándékosan több, mint 24 óra/nap
      }
      out.push(cur.slice());
    }
    return out;
  }
});

function dlImportErrorText(t, res) {
  if (res.error === 'day') {
    const reason = res.reason === 'rows' ? t('dl.import.reason.rows') : t('es.import.reason.' + res.reason);
    return t('dl.import.err.day', { n: res.index, reason });
  }
  if (res.error === 'task') return t('dl.import.err.task', { n: res.index, reason: t('tk.err.' + res.reason) });
  return t('dl.import.err.' + res.error);
}

// Közös export- és import-párbeszéd (a két új naplómodul és a Feladatok használja)
function openExportDialog(ctx, file, text, n) {
  const { t } = ctx;
  const ta = h('textarea', { id: 'dl-export-text', readonly: true, rows: 8 }, text);
  ctx.modal({
    title: t('dl.export.title'),
    body: [
      h('p', null, t('dl.export.ready', { file, n })),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn primary', id: 'dl-export-save', onclick: () => ctx.saveFile(file, text) }, icon('download'), t('es.export.download')),
        h('button', { class: 'btn', onclick: () => ctx.copyText(text, ta) }, t('es.export.copy'))),
      h('p', { class: 'hint' }, t('es.export.textHint')),
      ta
    ],
    actions: [{ label: t('btn.close'), value: true }]
  });
}
function openImportDialog(ctx, validate, apply) {
  const { t } = ctx;
  const fileIn = h('input', { type: 'file', id: 'dl-import-file', accept: '.json,application/json' });
  const ta = h('textarea', { id: 'dl-import-text', rows: 6 });
  const err = h('p', { class: 'notice-err', id: 'dl-import-error', hidden: true });
  const showErr = msg => { err.textContent = msg; err.hidden = false; };
  async function checkIt() {
    err.hidden = true;
    let text = ta.value.trim();
    if (fileIn.files && fileIn.files[0]) {
      try { text = await fileIn.files[0].text(); } catch (e) { showErr(t('dl.import.err.read')); return; }
    }
    if (!text) { showErr(t('es.import.noInput')); return; }
    const res = validate(text);
    if (!res.ok) { showErr(dlImportErrorText(t, res)); return; }
    const preview = apply(res, true);
    ctx.closeModal(null);
    const ok = await ctx.modal({ title: t('dl.import.title'),
      body: [h('p', null, t('dl.import.summary', { n: preview.n, overwrite: preview.overwrite }))],
      actions: [{ label: t('btn.cancel'), value: false }, { label: t('es.import.confirm'), value: true, kind: 'primary', id: 'dl-import-confirm' }] });
    if (!ok) return;
    apply(res, false);
    ctx.toast(t('dl.import.done', { n: preview.n }));
    ctx.rerender();
  }
  ctx.modal({
    title: t('dl.import.title'),
    body: [
      h('div', { class: 'field' }, h('label', { for: 'dl-import-file' }, t('es.import.choose')), fileIn),
      h('div', { class: 'field' }, h('label', { for: 'dl-import-text' }, t('es.import.paste')), ta),
      err
    ],
    actions: [{ label: t('btn.cancel'), value: false }, { label: t('es.import.check'), kind: 'primary', id: 'dl-import-check', onClick: checkIt, keepOpen: true }]
  });
}

/* =====================================================================
 * 10/d. KÖZÖS NAPI LISTA – felület
 *   mod: { id, titleKey, p (fordítási előtag: 'ep' | 'ml'), file, logic }
 * ===================================================================== */
function renderDayLog(root, ctx, mod) {
  const { t, mode, store } = ctx;
  const L = mod.logic, C = L.cfg;
  const P = (k, params) => t(mod.p + '.' + k, params);
  const perm = f => can(mode, f);
  let state = L.load(store);
  let date = (state.draft && isValidIsoDate(state.draft.__date)) ? state.draft.__date : ctx.today();

  function persist(next) { state = next; if (!L.save(store, state)) ctx.toast(t('storage.writeFailed'), true); }
  function rawValue(id) { const v = state.draft[id]; return v == null ? '' : String(v); }
  function setDraft(id, val) { state.draft = Object.assign({}, state.draft, { [id]: val }); L.save(store, state); }

  const totalEl = C.hasTotal ? h('div', { class: 'd-value', id: 'dl-total', 'aria-live': 'polite' }, '0') : null;
  const totalNote = h('div', { class: 'd-note', id: 'dl-total-note' });
  const prevRef = h('p', { class: 'hint', id: 'dl-prev-ref' });
  const rowEls = {};

  function evaluate() {
    const values = {};
    let shownInvalid = 0, emptyCount = 0;
    state.rows.forEach(row => {
      const el = rowEls[row.id];
      const raw = rawValue(row.id);
      el.wrap.classList.remove('invalid', 'dev-flag');
      el.msg.textContent = '';
      el.input.removeAttribute('aria-invalid');
      if (raw.trim() === '') { emptyCount++; return; }
      const p = L.parse(raw);
      if (!p.ok) {
        shownInvalid++;
        el.wrap.classList.add('invalid');
        el.input.setAttribute('aria-invalid', 'true');
        el.msg.textContent = t('es.err.' + p.error);
        return;
      }
      values[row.id] = p.value;
    });
    const flags = L.check(state, date, values);
    Object.entries(flags).forEach(([id, f]) => {
      const el = rowEls[id];
      el.wrap.classList.add('dev-flag');
      el.msg.textContent = devText(f);
    });
    if (C.check === 'hours') {
      state.rows.forEach(row => {
        const p = L.previousFor(state.days, row, date);
        rowEls[row.id].prev.textContent = p ? t('ml.prevValue', { value: p.value, date: fmtDate(p.date, ctx.lang) }) : '';
      });
      prevRef.textContent = t('ml.prevHint') + ' ' + t('ml.optional');
    } else {
      const prevDay = L.previousDay(state.days, date);
      prevRef.textContent = prevDay ? t('dl.prevRef', { date: fmtDate(prevDay.date, ctx.lang) }) : t('dl.prevNone');
    }
    if (totalEl) totalEl.textContent = String(L.sum(Object.values(values)));
    totalNote.textContent = shownInvalid ? t('dl.invalidCount', { n: shownInvalid }) : '';
    return { values, flags, shownInvalid, emptyCount };
  }
  function devText(f) {
    if (f.kind === 'threshold') return t('dl.deviation', { diff: signed(f.diff) });
    if (f.kind === 'lower') return t('ml.dev.lower', { prev: f.prev, date: fmtDate(f.prevDate, ctx.lang) });
    return t('ml.dev.tooHigh', { diff: signed(f.diff), date: fmtDate(f.prevDate, ctx.lang), days: f.days });
  }

  async function onSave() {
    if (!isValidIsoDate(date)) { ctx.toast(t('dl.badDate'), true); return; }
    const ev = evaluate();
    if (ev.shownInvalid > 0 || (C.requireAll && ev.emptyCount > 0) || !state.rows.length) {
      if (C.requireAll) state.rows.forEach(r => { if (rawValue(r.id).trim() === '') { rowEls[r.id].wrap.classList.add('invalid'); rowEls[r.id].msg.textContent = t('dl.err.empty'); } });
      ctx.toast(t('dl.fixErrors'), true);
      return;
    }
    if (!Object.keys(ev.values).length) { ctx.toast(t('dl.noneFilled'), true); return; }
    const existing = state.days.find(d => d.date === date);
    const flagged = Object.entries(ev.flags);
    if (existing || flagged.length) {
      const body = [];
      if (existing) body.push(h('p', { class: 'notice-warn' }, t('dl.confirm.overwrite', { date: fmtDate(date, ctx.lang) })));
      if (flagged.length) {
        body.push(h('p', null, C.check === 'threshold'
          ? t('dl.confirm.deviation', { date: fmtDate(flagged[0][1].prevDate, ctx.lang), threshold: state.threshold })
          : t('dl.confirm.check')));
        body.push(h('ul', null, flagged.map(([id, f]) => {
          const row = state.rows.find(r => r.id === id);
          return h('li', null, t('dl.confirm.devLine', { row: row.name, prev: f.prev, now: f.now, diff: signed(f.diff) }) +
            (C.check === 'hours' ? ' – ' + devText(f) : ''));
        })));
      }
      body.push(h('p', { class: 'hint' }, t('dl.confirm.sure')));
      const ok = await ctx.modal({ title: t('dl.confirm.title'), body, actions: [
        { label: t('btn.cancel'), value: false },
        { label: t('dl.confirm.save'), value: true, kind: 'primary', id: 'dl-confirm-save' }] });
      if (!ok) return;
    }
    const day = L.buildDay(state, date, ev.values);
    const res = L.upsertDay(state, day);
    res.state.draft = {};
    persist(res.state);
    ctx.toast(t('dl.saved', { date: fmtDate(date, ctx.lang) }));
    ctx.rerender();
  }
  function copyText() {
    const ev = evaluate();
    if (C.hasTotal) return buildCopyMessage(date, t(mod.titleKey), L.sum(Object.values(ev.values)));
    const rows = state.rows.filter(r => Number.isInteger(ev.values[r.id])).map(r => ({ name: r.name, value: ev.values[r.id] }));
    return buildCopyMessage(date, t(mod.titleKey), rows.length ? machineListText(rows) : '–');
  }

  const dateInput = h('input', { type: 'date', id: 'dl-date', value: date, onchange: e => { date = e.target.value; setDraft('__date', date); evaluate(); } });
  const countCard = h('section', { class: 'card', 'data-module-card': mod.id },
    C.hasTotal ? h('div', { class: 'display' }, h('div', { class: 'd-label' }, P('total')), totalEl, totalNote) : null,
    h('div', { class: 'date-row' },
      h('div', { class: 'field' }, h('label', { for: 'dl-date' }, t('dl.date')), dateInput), prevRef),
    C.hasTotal ? null : totalNote,
    state.rows.length ? null : h('p', { class: 'empty' }, P('noItems')),
    h('div', { class: 'rows' }, state.rows.map(row => {
      const id = 'dl-in-' + row.id;
      const input = h('input', { id, type: 'text', inputmode: 'numeric', autocomplete: 'off', enterkeyhint: 'next',
        'data-row': row.id, 'data-perm': 'entry.edit', value: rawValue(row.id), 'aria-describedby': id + '-msg ' + id + '-prev',
        oninput: e => { setDraft(row.id, e.target.value); evaluate(); } });
      const msg = h('div', { class: 'msg', id: id + '-msg' });
      const prev = h('div', { class: 'prev-hint', id: id + '-prev' });
      const wrap = h('div', { class: 'row-item' }, h('label', { for: id }, row.name), input, C.check === 'hours' ? prev : null, msg);
      rowEls[row.id] = { input, msg, wrap, prev };
      return wrap;
    })),
    h('div', { class: 'btn-row' },
      perm('entry.save') ? h('button', { class: 'btn primary big', id: 'dl-save', 'data-perm': 'entry.save', onclick: onSave }, icon('save'), t('dl.save')) : null,
      perm('entry.copy') ? h('button', { class: 'btn big', id: 'dl-copy', 'data-perm': 'entry.copy', onclick: () => ctx.copyMessage(copyText()) }, icon('copy'), t('dl.copyMsg')) : null),
    (C.check === 'threshold' && !perm('threshold.edit')) ? h('p', { class: 'hint', style: 'margin-top:12px' }, P('threshold.readonly', { n: state.threshold })) : null
  );

  function showDay(d) {
    ctx.modal({
      title: t('dl.history.detail', { date: fmtDate(d.date, ctx.lang) }),
      body: [
        d.demo ? h('span', { class: 'chip demo' }, t('dl.demo')) : null,
        h('div', { class: 'tbl-scroll' }, h('table', { class: 'kv', id: 'dl-day-table' },
          h('thead', null, h('tr', null, h('th', null, P('items')), h('th', null, P('value')))),
          h('tbody', null, d.rows.map(r => h('tr', null, h('td', null, r.name), h('td', null, String(r.value)))),
            C.hasTotal ? h('tr', null, h('th', null, P('total')), h('td', null, h('strong', null, String(d.total)))) : null))),
        h('p', { class: 'hint' }, t('dl.history.savedAt', { time: fmtDateTime(d.savedAt, ctx.lang) }))
      ],
      actions: [{ label: t('btn.close'), value: true, kind: 'primary' }]
    });
  }
  const historyCard = perm('history.view') ? h('section', { class: 'card', 'data-perm': 'history.view' },
    h('h2', null, t('dl.history')),
    state.days.length ? h('div', { class: 'history', id: 'dl-history' }, L.sortedDays(state.days).map(d =>
      h('button', { class: 'hist-item', 'data-date': d.date, onclick: () => showDay(d) },
        h('span', { class: 'h-date' }, fmtDate(d.date, ctx.lang), d.demo ? h('span', { class: 'chip demo' }, t('dl.demo')) : null),
